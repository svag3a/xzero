name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAVILY_API_KEY,BOLAGSVERKET_CLIENT_ID,BOLAGSVERKET_CLIENT_SECRET,BOLAGSVERKET_TOKEN_URL,BOLAGSVERKET_BASE_URL
          script: |
            set -e
            docker image prune -af
            docker builder prune -af
            cd /opt/opportunity-scan
            git pull origin main
            # Uppdatera nycklar i .env
            update_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env TAVILY_API_KEY "$TAVILY_API_KEY"
            update_env BOLAGSVERKET_CLIENT_ID "$BOLAGSVERKET_CLIENT_ID"
            update_env BOLAGSVERKET_CLIENT_SECRET "$BOLAGSVERKET_CLIENT_SECRET"
            update_env BOLAGSVERKET_TOKEN_URL "$BOLAGSVERKET_TOKEN_URL"
            update_env BOLAGSVERKET_BASE_URL "$BOLAGSVERKET_BASE_URL"
            docker compose build --no-cache
            docker compose up -d
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID }}
          BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET }}
          BOLAGSVERKET_TOKEN_URL: ${{ secrets.BOLAGSVERKET_TOKEN_URL }}
          BOLAGSVERKET_BASE_URL: ${{ secrets.BOLAGSVERKET_BASE_URL }}
